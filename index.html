</div>
</section>
</template>

<!-- ============ CV MODAL ============ -->
<template data-sc="if" value="{{cvOpen}}" hint-placeholder-val="{{false}}">
<div style="position: fixed; inset: 0; z-index: 50; background: rgba(20,23,79,.6); display: flex; align-items: center; justify-content: center; padding: 16px">
<div role="dialog" aria-modal="true" aria-labelledby="cv-h" style="width: 100%; max-width: 860px; max-height: 92vh; overflow-y: auto; background: #FFFFFF; border-radius: 16px; padding: clamp(22px, 3vw, 40px)">

  cvLinesOf(cv, limit) {

    const P = 'font-size: 13.5px; line-height: 1.45; margin: 0';
    const B = 'font-size: 13.5px; line-height: 1.45; margin: 0; padding-left: 16px; text-indent: -12px';
    const ROLE = 'font-size: 13.5px; font-weight: 700; margin: 6px 0 0';
    add(cv.name || 'Your Name', H1);
    add([cv.city, cv.phone, cv.email, cv.link].filter((x) => String(x || '').trim()).join(' | ') || 'City | 07700 900000 | you@example.com', SUB);
    if (cv.profile.trim()) { add('PERSONAL PROFILE', H2); add(cv.profile, P); }
    const exp = cv.exp.filter((e) => e.role.trim() || e.org.trim() || e.bullets.trim());
    if (exp.length) {
      add('WORK AND VOLUNTEERING EXPERIENCE', H2);
      exp.forEach((e) => {
        add([e.role, [e.org, e.place].filter(Boolean).join(', ')].filter(Boolean).join(', ') + (e.dates ? ' | ' + e.dates : ''), ROLE);
        e.bullets.split('\n').map((x) => x.replace(/^[-•*]\s*/, '').trim()).filter(Boolean).forEach((b) => add('• ' + b, B));
      });
    }
    if (cv.degree.trim() || cv.uni.trim()) {
      add('EDUCATION', H2);
      add([cv.degree, cv.uni].filter(Boolean).join(', ') + (cv.eduDates ? ' | ' + cv.eduDates : ''), ROLE);
      add(cv.eduNote, P);
    }
    if (cv.skills.trim() || cv.langs.trim()) {
      add('SKILLS', H2);
      add(cv.skills ? 'Skills: ' + cv.skills : '', P);
      add(cv.langs ? 'Languages: ' + cv.langs : '', P);
    }
    add('AVAILABILITY', H2);
    add('Available up to ' + limit + ' hours a week in term time, and full-time during university vacations.', P);
    if (cv.rtw) add('Right to work: Student visa, share code available on request.', P);
    return L;
  }

  checkCv(cv, lines) {
    const out = [];
    const add = (lvl, msg) => out.push({ lvl, msg });
    const all = [cv.name, cv.profile, cv.skills, cv.langs, cv.eduNote, ...cv.exp.map((e) => e.role + ' ' + e.bullets)].join(' \n ');
    if (/date of birth|\bD\.?O\.?B\b|\d{1,2} years old|\bage\s*:|marital|\bmarried\b|\breligion\b|\bmuslim\b|\bchristian\b|\bhindu\b|\bbuddhist\b|nationality|passport no|visa number|photo/i.test(all))
      add(2, 'Remove personal details UK employers do not ask for: age or date of birth, marital status, religion, nationality, passport numbers or a photo.');
    if (!cv.name.trim()) add(2, 'Add your full name at the top.');
    const phone = cv.phone.replace(/[\s()-]/g, '');
    if (!phone) add(2, 'Add a UK mobile number. Employers call candidates.');
    else if (!/^(\+44|0)7\d{9}$/.test(phone)) add(1, 'Use a UK mobile number (07… or +44 7…). Get a UK SIM in your first week.');
    if (!/^\S+@\S+\.\S+$/.test(cv.email.trim())) add(1, 'Add an email address you check every day.');
    const pw = cv.profile.trim() ? cv.profile.trim().split(/\s+/).length : 0;
    if (!pw) add(1, 'Write a short personal profile: 40 to 80 words.');
    else if (pw < 30 || pw > 90) add(1, 'Keep the profile between 40 and 80 words. It has ' + pw + '.');
    const bullets = cv.exp.flatMap((e) => e.bullets.split('\n').map((x) => x.trim()).filter(Boolean));
    if (!bullets.length) add(1, 'Add at least one job, volunteering role or project, with what you achieved.');
    else {
      const withNum = bullets.filter((b) => /\d/.test(b)).length;
      if (withNum < Math.ceil(bullets.length / 2)) add(1, 'Add numbers to more lines: customers served, money handled, people trained. ' + withNum + ' of ' + bullets.length + ' lines have one.');
      if (bullets.some((b) => /responsible for|duties included|helped with|worked on|in charge of/i.test(b))) add(1, 'Start lines with an action verb (served, trained, organised) instead of “responsible for” or “helped with”.');
      if (bullets.some((b) => /^I\s/.test(b))) add(1, 'Drop “I” at the start of lines: “Trained 4 new staff”, not “I trained 4 new staff”.');
    }
    if (!cv.skills.trim()) add(1, 'List 5 to 8 skills that match the job, such as customer service or cash handling.');
    const words = lines.reduce((n, l) => n + l.text.split(/\s+/).length, 0);
    if (words > 650) add(1, 'Over about 650 words: this will run past two pages. Cut older or less relevant lines.');
    add(0, 'Standard headings and a one-column layout that screening software can read.');
    add(0, 'Availability and visa hours are stated, which part-time employers look for.');
    const red = out.filter((x) => x.lvl === 2).length, amb = out.filter((x) => x.lvl === 1).length;
    const score = Math.max(0, Math.min(100, 100 - red * 22 - amb * 8));
    const tags = [['OK', '#14653F', '#E6F7EE'], ['Fix', '#7A5300', '#FFF3CC'], ['Must', '#B3122B', '#FDE7EA']];
    return { score, color: score >= 80 ? '#1F8A5B' : (score >= 55 ? '#E0A100' : '#C0152F'),
      items: out.sort((a, b) => b.lvl - a.lvl).map((x) => ({ msg: x.msg, tag: tags[x.lvl][0], color: tags[x.lvl][1], bg: tags[x.lvl][2] })) };
  }

  keywordsOf(ad, cvText) {
    const counts = {};
    (ad.toLowerCase().match(/[a-z][a-z+#-]{3,}/g) || []).forEach((w) => { if (!STOP.has(w)) counts[w] = (counts[w] || 0) + 1; });
    const top = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 14);
    const text = cvText.toLowerCase();
    return top.map((w) => ({ word: w, hit: text.includes(w) }));
  }

    this.setState({ cvAi: { ...s.cvAi, busy: kind + (i === undefined ? '' : i), err: '' } });

    } catch (e) {
      const code = e && e.code;
      const msg = code === 'not_granted' || code === 'sampling_disabled' ? 'AI suggestions are turned off for this page. You can still write and check your CV.'
        : code === 'rate_limited' ? 'Too many AI requests. Try again in a minute.'
        : code === 'invalid_json' ? 'The AI reply could not be read. Try again.'
        : code === 'cancelled' ? '' : 'The AI could not answer just now. Try again.';
      this.setState({ cvAi: { ...this.state.cvAi, busy: '', err: msg }, ai: (code === 'not_granted' || code === 'sampling_disabled') ? 'off' : this.state.ai });
    }
  }

  docxBytes(lines) {
    const esc = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const run = (t, sz, bold) => '<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>' + (bold ? '<w:b/>' : '') + '<w:sz w:val="' + sz + '"/></w:rPr><w:t xml:space="preserve">' + esc(t) + '</w:t></w:r>';
    const body = lines.map((l) => {
      const st = l.style;
      if (/font-size: 26px/.test(st)) return '<w:p><w:pPr><w:spacing w:after="40"/></w:pPr>' + run(l.text, 40, true) + '</w:p>';
      if (/letter-spacing/.test(st)) return '<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="999999"/></w:pBdr><w:spacing w:before="220" w:after="60"/></w:pPr>' + run(l.text, 22, true) + '</w:p>';
      if (/font-weight: 700/.test(st)) return '<w:p><w:pPr><w:spacing w:before="100" w:after="20"/></w:pPr>' + run(l.text, 21, true) + '</w:p>';
      if (/text-indent/.test(st)) return '<w:p><w:pPr><w:ind w:left="360" w:hanging="220"/><w:spacing w:after="20"/></w:pPr>' + run(l.text, 21, false) + '</w:p>';
      return '<w:p><w:pPr><w:spacing w:after="40"/></w:pPr>' + run(l.text, 21, false) + '</w:p>';
    }).join('');
    const files = [
      ['[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'],
      ['_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],
      ['word/document.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' + body + '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1000" w:right="1000" w:bottom="1000" w:left="1000" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>']
    ];
    const enc = new TextEncoder();
    const crcT = [];
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; crcT.push(c >>> 0); }
    const crc = (b) => { let c = 0xFFFFFFFF; for (let k = 0; k < b.length; k++) c = crcT.at((c ^ b.at(k)) & 0xFF) ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
    const parts = [], central = [];
    let offset = 0;
    files.forEach(([name, text]) => {
      const nm = enc.encode(name), data = enc.encode(text), c = crc(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0, true); h.setUint16(8, 0, true);
      h.setUint16(10, 0, true); h.setUint16(12, 0x21, true); h.setUint32(14, c, true); h.setUint32(18, data.length, true);
      h.setUint32(22, data.length, true); h.setUint16(26, nm.length, true); h.setUint16(28, 0, true);
      const cd = new DataView(new ArrayBuffer(46));
      cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(8, 0, true); cd.setUint16(10, 0, true);
      cd.setUint16(12, 0, true); cd.setUint16(14, 0x21, true); cd.setUint32(16, c, true); cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true);
      cd.setUint16(28, nm.length, true); cd.setUint16(30, 0, true); cd.setUint16(32, 0, true); cd.setUint16(34, 0, true); cd.setUint16(36, 0, true);
      cd.setUint32(38, 0, true); cd.setUint32(42, offset, true);
      parts.push(new Uint8Array(h.buffer), nm, data);
      central.push(new Uint8Array(cd.buffer), nm);
      offset += 30 + nm.length + data.length;
    });
    const cdSize = central.reduce((n, a) => n + a.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    const chunks = parts.concat(central, [new Uint8Array(end.buffer)]);
    const outB = new Uint8Array(chunks.reduce((n, a) => n + a.length, 0));
    let pos = 0;
    chunks.forEach((a) => { outB.set(a, pos); pos += a.length; });
    return outB;
  }

  async downloadCv(lines, name) {
    const bytes = this.docxBytes(lines);
    const file = (name.trim() ? name.trim().replace(/[^A-Za-z0-9]+/g, '-') : 'My') + '-CV.docx';
    if (this.dl) {
      try { await this.dl.save({ filename: file, data: bytes }); this.setState({ cvMsg: 'Saved ' + file }); }
      catch (e) { this.setState({ cvMsg: e && e.code === 'declined' ? 'Download cancelled.' : 'Download is not available here. Use Copy CV text.' }); }
      return;
    }
    try {
      const url = URL.createObjectURL(new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' }));
      const a = document.createElement('a');
      a.href = url; a.download = file; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
      this.setState({ cvMsg: 'Downloaded ' + file });
    } catch (e) { this.setState({ cvMsg: 'Download is not available here. Use Copy CV text.' }); }
  }

  money(n) {
    const v = Math.round(Math.abs(n));
    return (n < 0 ? '-£' : '£') + v.toLocaleString('en-GB');

  num(e) {
    const v = parseFloat(e.target.value);
    return isNaN(v) || v < 0 ? 0 : v;

  minWage(age) { return age === '18' ? 10.85 : 12.71; }

  visaStatus(hours, limit, period) {
    if (period === 'vacation') {
      return { bg: '#DDF6E8', fg: '#14174F', dot: '#1F8A5B', dotFg: '#FFFFFF', icon: '✓', title: 'Full-time is allowed in official vacations', text: 'Only inside your university’s vacation dates. For most Masters students the summer counts as term time.' };
    }
    if (hours > limit) {
      return { bg: '#C0152F', fg: '#FFFFFF', dot: '#FFFFFF', dotFg: '#C0152F', icon: '✕', title: 'Over your limit by ' + (hours - limit) + ' hours', text: 'More than ' + limit + ' hours in any Monday to Sunday week of term breaks your visa conditions. Drop a shift.' };
    }
    if (hours === limit) {
      return { bg: '#FFE7A3', fg: '#3D2A00', dot: '#E0A100', dotFg: '#14174F', icon: '!', title: 'Exactly at your limit', text: 'Any extra shift this week, paid or unpaid, would put you over ' + limit + ' hours.' };
    }
    return { bg: '#DDF6E8', fg: '#14174F', dot: '#1F8A5B', dotFg: '#FFFFFF', icon: '✓', title: 'Within your limit', text: (limit - hours) + ' hours to spare this week.' };
  }

  // Visa and pay checks for one listing. Returns level 0 clear, 1 check, 2 over limit.
  checkJob(j, limit, age) {
    const notes = [];
    let level = 0;
    const pay = j[4];
    const floor = this.minWage(age);
    const first = pay.match(/£([\d,.]+)/);
    const low = first ? parseFloat(first[1].replace(/,/g, '')) : null;
    if (/per hour/.test(pay) && low !== null && low < floor) {
      level = Math.max(level, 1);
      notes.push('Pay band starts at £' + low.toFixed(2) + '. At your age you must get at least £' + floor.toFixed(2) + ' an hour.');
    }
    if (/per day/.test(pay)) {
      level = Math.max(level, 1);
      notes.push('Paid by the day. In term time keep to ' + (limit >= 20 ? 'two days' : 'one day') + ' a week to stay under ' + limit + ' hours.');
    }
    const h = j[1].match(/(\d+)\s*(hours|hour|hrs|hr|h)\b/i) || String(j[11] || '').match(/(\d{1,2})\s*(?:hours|hrs|hr)\s*(?:per|a|each|\/)\s*week/i);
    if (h) {
      const n = parseInt(h[1], 10);
      if (n > limit) { level = 2; notes.push('Advertised at ' + n + ' hours a week, above your ' + limit + '-hour term-time limit.'); }
      else if (n === limit) { level = Math.max(level, 1); notes.push('Advertised at ' + n + ' hours: exactly your limit, so no other work that week.'); }
      else { notes.push(n + ' hours a week fits your ' + limit + '-hour limit.'); }
    }
    if (/christmas|chrsitmas|seasonal/i.test(j[1])) {
      notes.push('Seasonal: extra hours only inside official vacation dates.');
    }
    if (/full-time or part-time/.test(j[5]) && !h) {
      notes.push('Open to full or part-time: ask for a part-time contract.');
    }
    if (!notes.length) notes.push('Part-time employee contract at or above the minimum wage.');
    return { level, notes };
  }

  checkAd(text, limit, floor) {
    if (!text.trim()) return null;
    const f = [];
    const add = (level, msg) => f.push({ level, msg });
    if (/self[- ]?employ|freelanc|contractor\b|own boss|invoice|commission[- ]only|per (delivery|drop|order|parcel)|courier|deliveroo|uber ?eats|just ?eat|gig\b/i.test(text)) add(2, 'Signs of self-employment: freelance, commission-only, courier or paid per delivery. Not allowed on a Student visa.');
    if (/cash in hand|cash only|paid in cash/i.test(text)) add(2, 'Cash in hand: no payslip, no proof of your hours, and often below the minimum wage.');
    if (/\b(dj|musician|dancer|performer|entertainer|actor|actress|sports coach|footballer)\b/i.test(text)) add(2, 'Entertainer, sportsperson and coach roles are not allowed on a Student visa.');
    if (/full[- ]time/i.test(text) && !/part[- ]time/i.test(text)) add(1, 'Advertised as full-time. Only take it as a part-time contract, or for official vacation weeks.');
    let maxH = 0;
    (text.match(/\d{1,2}(\.\d)?\s*(hours|hrs|hr|h)\b/gi) || []).forEach((m) => { maxH = Math.max(maxH, parseFloat(m)); });
    if (maxH > limit) add(2, 'Mentions ' + maxH + ' hours a week, more than your ' + limit + '-hour term-time limit.');
    else if (maxH === limit) add(1, 'Mentions ' + maxH + ' hours: exactly your limit, so no other work that week.');
    else if (maxH > 0) add(0, maxH + ' hours a week fits your ' + limit + '-hour limit.');
    let minPay = null;
    (text.match(/£\s?\d+(\.\d{1,2})?\s*(per hour|an hour|\/\s?hr|\/\s?hour|ph\b|p\/h|hourly)/gi) || []).forEach((m) => {
      const v = parseFloat(m.replace(/[^\d.]/g, ''));
      minPay = minPay === null ? v : Math.min(minPay, v);
    });
    if (minPay !== null && minPay < floor) add(2, '£' + minPay.toFixed(2) + ' an hour is below the £' + floor.toFixed(2) + ' minimum for your age.');
    else if (minPay !== null) add(0, '£' + minPay.toFixed(2) + ' an hour meets the minimum wage for your age.');
    if (/unpaid trial|trial shift/i.test(text)) add(1, 'Trial shifts must be paid at minimum wage, and the hours count towards your weekly limit.');
    if (/paye|payslip|employee|right to work|share code|holiday pay/i.test(text)) add(0, 'Mentions payroll, payslips or right to work checks: signs of a proper employee job.');
    const level = f.reduce((m, x) => Math.max(m, x.level), 0);
    if (!f.some((x) => x.level > 0) && !/paye|payslip|employee/i.test(text)) add(1, 'The ad does not say how you are paid. Ask: “Will I be an employee paid through PAYE?”');
    const lv = Math.max(level, f.reduce((m, x) => Math.max(m, x.level), 0));
    const tags = [['Looks fine', '#14653F'], ['Check', '#7A5300'], ['Stop', '#B3122B']];
    return {
      has: true, color: ['#1F8A5B', '#E0A100', '#C0152F'][lv],
      title: ['No red flags found', 'Check these points before applying', 'Do not take this job on a Student visa'][lv],
      findings: f.sort((a, b) => b.level - a.level).map((x) => ({ msg: x.msg, tag: tags[x.level][0] + ':', color: tags[x.level][1] }))
    };
  }

  checkSlip(sl, limit, floor) {
    const hours = parseFloat(sl.hours), gross = parseFloat(sl.gross), tax = parseFloat(sl.tax) || 0;
    if (!(hours > 0) || !(gross > 0)) return { has: false, empty: true, results: [] };
    const ok = (t, d) => ({ t, d, bg: '#DDF6E8', fg: '#14174F' });
    const warn = (t, d) => ({ t, d, bg: '#FFE7A3', fg: '#3D2A00' });
    const bad = (t, d) => ({ t, d, bg: '#C0152F', fg: '#FFFFFF' });
    const out = [];
    const rate = gross / hours;
    if (rate + 0.005 < floor) out.push(bad('Underpaid: £' + rate.toFixed(2) + ' an hour', 'The minimum for your age is £' + floor.toFixed(2) + '. You are owed about £' + (floor * hours - gross).toFixed(2) + ' for this payslip. Raise it with your manager or call Acas.'));
    else out.push(ok('Pay rate OK: £' + rate.toFixed(2) + ' an hour', 'At or above the £' + floor.toFixed(2) + ' minimum for your age.'));
    const weekly = sl.period === 'weekly';
    const perWeek = weekly ? hours : hours * 12 / 52;
    if (weekly && hours > limit) out.push(bad(hours + ' hours in one week', 'More than your ' + limit + '-hour limit, unless this was an official vacation week.'));
    else if (!weekly && perWeek > limit) out.push(warn('Averages ' + perWeek.toFixed(1) + ' hours a week', 'Check each Monday to Sunday week stayed within ' + limit + ' hours, or fell in an official vacation.'));
    else out.push(ok('Hours look within your limit', (weekly ? hours : perWeek.toFixed(1)) + ' hours a week on average.'));
    const code = (sl.code || '').toUpperCase().replace(/\s/g, '');
    if (!code) out.push(warn('Add your tax code', 'It is printed on the payslip, for example 1257L.'));
    else if (/^(0T|BR|D0|D1|NT)/.test(code) || /(W1|M1|X)$/.test(code)) out.push(warn('Emergency or temporary tax code: ' + code, 'You may be paying too much tax for now. Make sure your employer has your National Insurance number; HMRC usually corrects the code and refunds the difference.'));
    else if (code === '1257L') out.push(ok('Normal tax code: 1257L', 'Your first £12,570 a year is tax-free.'));
    else out.push(warn('Unusual tax code: ' + code, 'Check it in your HMRC app or personal tax account.'));
    const yearly = weekly ? gross * 52 : gross * 12;
    if (tax > 0 && yearly < 12570) out.push(warn('Tax taken, but your yearly pay looks under £12,570', 'This often happens with an emergency code. Overpaid tax is usually refunded through your pay or by HMRC.'));
    out.push(ok('Holiday pay', 'You build up paid holiday: 5.6 weeks a year, pro rata. Ask your employer how it is paid.'));
    return { has: true, empty: false, results: out };
  }
