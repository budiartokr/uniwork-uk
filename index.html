<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniWork UK: arrival and part-time work for international students</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E4ADD">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UniWork">

<meta name="description" content="Arrival plan, visa-checked part-time jobs, budget and visa sponsors for international students in the UK.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 0a16 16 0 0 1 16 16 16 16 0 0 1-16 16H0V16A16 16 0 0 1 16 0z' fill='%23FFC83D'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23393BE7'/%3E%3C/svg%3E">

<style>
body{margin:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
a{color:#1E4ADD}a:hover{color:#14174F}
*{box-sizing:border-box}
button,input,select{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #F8D93A;outline-offset:2px}
input[type=range]{accent-color:#1E4ADD;width:100%;height:44px;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:10px;border:2px solid transparent;font-size:16px;font-weight:600;text-decoration:none;transition:transform .15s ease,box-shadow .15s ease}
.btn:hover{transform:translateY(-2px)}
.sun{background:#F8D93A;color:#14174F}.sun:hover{color:#14174F;box-shadow:0 8px 0 -2px #14174F}
.ind{background:#1E4ADD;color:#FFFFFF}.ind:hover{color:#FFFFFF;box-shadow:0 8px 0 -2px #F8D93A}
.ghost{background:transparent;color:#FFFFFF;border-color:#FFFFFF}.ghost:hover{color:#FFFFFF}
.outline{background:#FFFFFF;color:#1E4ADD;border-color:#1E4ADD}
.field{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:2px solid #B9C4F5;background:#FFFFFF;color:#14174F;font-size:16px}
.field:focus{border-color:#1E4ADD}
.lift{transition:transform .15s ease}
.lift:hover{transform:translateY(-4px)}
.navbtn:hover{color:#1E4ADD !important}
.heroimg{position:absolute;right:0;bottom:0;height:min(100%,470px);width:auto;max-width:44%;object-fit:contain;object-position:right bottom;pointer-events:none}
.heroimg-cut{right:clamp(16px,4vw,72px);height:min(90%,400px)}
.heroimg-m{display:none}
.herotext{max-width:min(620px,54%) !important;min-height:300px}
.topnav{flex-wrap:nowrap !important;overflow-x:auto;scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.topnav button{white-space:nowrap}
.cvprev p{margin:0}
.onbstrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.onbstrip::-webkit-scrollbar{display:none}
.onbtab{flex:none;text-align:left;min-height:56px;padding:8px 16px;border-radius:12px;border:2px solid transparent;transition:background .15s ease}
.onbtab:hover{background:#FFFFFF}
.jtab{flex:1 1 0;min-width:0;text-align:left;padding:14px 18px 16px;border:none;border-radius:14px 14px 0 0;transition:background .15s ease}
.hero2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:end}
.hero2img{display:block;width:100%;max-width:520px;height:auto;margin-left:auto;align-self:end;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 24%),linear-gradient(to right,transparent 0,#000 22%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,transparent 0,#000 24%),linear-gradient(to right,transparent 0,#000 22%);mask-composite:intersect}
.jpanel{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:28px;align-items:center}
@media (max-width:900px){.hero2,.jpanel{grid-template-columns:1fr}.hero2img{display:none}.jimg{display:none}}
@media (max-width:560px){.jtab{padding:12px 10px}.jtab small{display:none}}
@media (max-width:1200px){.hidemd{display:none !important}}
@media (max-width:900px){.heroimg{display:none}.heroimg-m{display:block;width:100%;height:210px;object-fit:contain;object-position:center bottom;margin:12px 0 0}.herotext{max-width:100% !important;min-height:0;padding-bottom:16px !important}}
.bottomnav{display:none}
textarea:focus{border-color:#F8D93A;outline:none}
.root{padding-bottom:64px}
.offerbar{position:fixed;left:0;right:0;bottom:0;z-index:38}
.onlysm{display:none !important}
@media (max-width:900px){.onlysm{display:block !important}}
.lbl-s{display:none}
@media (max-width:1150px){.lbl-l{display:none}.lbl-s{display:inline}}
@media (max-width:1399px){.hidexl{display:none !important}}
@media (max-width:400px){.bottomnav button{font-size:11px !important}}
@media (max-width:420px){.logo{font-size:18px !important;gap:6px !important}.logo svg{width:26px;height:26px}}
@media (max-width:560px){.jtab span{font-size:19px !important}}
@media print{header,nav,footer,.offerbar,.bottomnav,.noprint{display:none !important}.root{padding-bottom:0 !important}}
@media (max-width:900px){.topnav{display:none !important}.bottomnav{display:flex !important}.root{padding-bottom:132px}.hidesm{display:none !important}.offerbar{bottom:62px}.offertext{display:none !important}}
@media (prefers-reduced-motion:reduce){.btn,.lift,.onbtab,.jtab{transition:none}.btn:hover,.lift:hover{transform:none}}
</style>

<body>
<div id="app"></div>
<template id="tpl">

<div class="root" style="font-family: Geist, system-ui, sans-serif; color: #14174F; background: #F5F6FB; min-height: 100vh; font-size: 16px; line-height: 1.6">

<!-- ============ HEADER ============ -->
<header style="background: #FFFFFF; border-bottom: 1px solid #E3E7F5; padding: 0 clamp(16px, 4vw, 40px); display: flex; flex-wrap: nowrap; align-items: center; gap: 0 24px; position: sticky; top: 0; z-index: 30">
<button onClick="{{go.start}}" aria-label="UniWork UK, go to start" class="logo" style="display: flex; align-items: center; gap: 10px; background: none; border: none; padding: 0; min-height: 60px; color: #1E4ADD; font-family: Geist, sans-serif; font-weight: 800; font-size: 21px; letter-spacing: -0.02em">
<svg aria-hidden="true" viewBox="0 0 32 32" width="32" height="32" style="flex: none"><circle cx="16" cy="16" r="16" style="fill: #1E4ADD"></circle><path d="M5 13.5 16 8l11 5.5L16 19z" style="fill: #FFFFFF"></path><path d="M10 16.5v4.5c0 1.8 2.7 3.2 6 3.2s6-1.4 6-3.2v-4.5L16 19.5z" style="fill: #F8D93A"></path><path d="M25 14v6" style="stroke: #FFFFFF; stroke-width: 1.6; stroke-linecap: round"></path></svg>
UniWork UK
</button>
<nav class="topnav" aria-label="Main" style="display: flex; gap: 0 2px; flex: 1 1 0; min-width: 0">
<template data-sc="for" list="{{nav}}" as="item" hint-placeholder-count="6">
<button class="navbtn" onClick="{{item.go}}" aria-current="{{item.current}}" style="min-height: 60px; padding: 0 10px; border: none; border-bottom: 4px solid {{item.bar}}; border-top: 4px solid transparent; background: none; font-size: 15px; font-weight: {{item.weight}}; color: #14174F"><span class="lbl-l">{{item.label}}</span><span class="lbl-s">{{item.short}}</span></button>
</template>
</nav>
<div style="display: flex; align-items: center; gap: 10px; margin-left: auto; padding: 8px 0">
<button onClick="{{go.jobs}}" class="hidesm hidexl" style="min-height: 40px; padding: 0 14px; border-radius: 8px; border: none; background: #F8D93A; color: #0B1440; font-size: 14px; font-weight: 700; white-space: nowrap">Find part-time jobs</button>
<button onClick="{{openHelp}}" aria-haspopup="dialog" style="min-height: 40px; padding: 0 14px; border-radius: 8px; border: none; background: #1E4ADD; color: #FFFFFF; font-size: 14px; font-weight: 700; white-space: nowrap">Get help</button>
<button onClick="{{go.account}}" class="{{hdrAccClass}}" style="min-height: 40px; padding: 0 14px; border-radius: 8px; border: 2px solid #1E4ADD; background: #FFFFFF; color: #1E4ADD; font-size: 14px; font-weight: 700; white-space: nowrap">{{accLabel}}</button>
</div>
</header>
<nav class="bottomnav" aria-label="Main, mobile" style="position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #FFFFFF; border-top: 1px solid #DCE3F7; padding: 4px 4px 8px; justify-content: space-around; box-shadow: 0 -8px 24px -18px #14174F">
<template data-sc="for" list="{{bnav}}" as="b" hint-placeholder-count="6">
<button onClick="{{b.go}}" aria-current="{{b.current}}" style="flex: 1; min-height: 58px; border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600; color: {{b.fg}}"><span aria-hidden="true" style="width: 32px; height: 4px; border-radius: 999px; background: {{b.bar}}"></span><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="{{b.icon}}"></path></svg>{{b.label}}</button>
</template>
</nav>

<!-- ============ WELCOME (landing) ============ -->
<template data-sc="if" value="{{hasStrip}}" hint-placeholder-val="{{false}}">
<nav aria-label="{{stageName}} pages" style="background: #EEF1FD; border-bottom: 1px solid #DCE3F7; padding: 10px clamp(16px, 4vw, 40px)">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px">
<p style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; color: #14174F">{{stageName}} <span style="font-weight: 500; font-size: 14px; color: #4A4F86">{{stageNote}}</span></p>
<div class="onbstrip" style="flex: 1 1 520px; min-width: 0">
<template data-sc="for" list="{{stageTabs}}" as="o" hint-placeholder-count="4"><button class="onbtab" onClick="{{o.go}}" aria-current="{{o.current}}" style="background: {{o.bg}}; border-color: {{o.border}}; color: #14174F"><strong style="display: block; font-size: 15px; font-weight: 700; line-height: 1.3">{{o.label}}</strong><span style="display: block; font-size: 13px; color: #4A4F86; line-height: 1.3">{{o.status}}</span></button></template>
</div>
</div>
</nav>
</template>
<template data-sc="if" value="{{isHome}}" hint-placeholder-val="{{true}}">
<main style="background: #F5F6FB">
<section aria-labelledby="hero-h" style="background: #1E4ADD; color: #FFFFFF; position: relative; overflow: hidden; padding: clamp(28px, 4vw, 52px) clamp(16px, 4vw, 40px) 0">
<div class="hero2" style="max-width: 1240px; margin: 0 auto">
<div style="padding-bottom: clamp(28px, 4vw, 52px); min-width: 0">
<p style="margin: 0 0 16px; font-weight: 600; font-size: 16px; color: #DCE3FF">For international students on a UK Student visa</p>
<h1 id="hero-h" style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; line-height: 0.94; letter-spacing: -0.035em">
<span style="display: block; color: #FFFFFF; font-size: clamp(36px, 4.3vw, 64px)">From your first week to your</span>
<span style="position: relative; display: inline-block; margin: 12px 0 0 -10px; padding: clamp(10px, 1.1vw, 14px) clamp(22px, 2.4vw, 34px) clamp(14px, 1.6vw, 22px) clamp(14px, 1.4vw, 20px); background: #F8D93A; color: #0B1440; font-size: clamp(40px, 5.4vw, 80px); transform: rotate(-1.5deg)">Graduate visa<svg aria-hidden="true" viewBox="0 0 140 120" style="position: absolute; right: clamp(-40px, -2.8vw, -22px); top: 30%; width: clamp(44px, 4.6vw, 70px); height: auto; fill: #01D46B"><path d="M24 64 C8 30 46 6 70 30 C78 8 118 4 124 34 C150 50 132 92 104 92 C96 118 54 122 46 98 C18 102 4 82 24 64 Z"></path></svg></span>
</h1>
<p style="margin: 30px 0 0; max-width: 31em; font-size: clamp(17px, 1.4vw, 19px); font-weight: 500">One plan for your whole time in the UK. <strong style="font-weight: 700; color: #F8D93A">Arrive</strong> and settle in, <strong style="font-weight: 700; color: #F8D93A">work</strong> part-time within your visa, plan your <strong style="font-weight: 700; color: #F8D93A">money</strong>, and get ready to <strong style="font-weight: 700; color: #F8D93A">stay</strong> after your degree.</p>
<p style="margin: 26px 0 10px; font-weight: 700; font-size: 17px">Where are you now?</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px">
<button onClick="{{doorHome}}" style="text-align: left; border: 2px solid #F8D93A; background: #F8D93A; color: #0B1440; border-radius: 14px; padding: 14px 16px; min-height: 72px"><strong style="display: block; font-size: 18px; font-weight: 800">I’m still at home</strong><span style="font-size: 14px">Visa, money and travel, step by step</span></button>

<div style="flex: 1 1 260px; min-width: 0"><p style="margin: 0; font-weight: 700; color: #F8D93A">{{pd.dashKicker}}</p><h2 id="dash-pre" style="margin: 4px 0 0; font-family: Geist, sans-serif; font-weight: 800; font-size: clamp(26px, 3vw, 36px); letter-spacing: -0.03em; line-height: 1.08">Before you fly: {{pd.progress}}</h2><button class="btn sun" style="margin-top: 16px" onClick="{{go.predep}}">Open my pre-departure plan</button><p style="margin: 12px 0 0; font-size: 14px">No LoA, CAS or visa yet? <a href="https://www.globaltalent-education.com" target="_blank" rel="noopener" onClick="{{gteClick}}" style="color: #F8D93A; font-weight: 700">Free consultation with Global Talent Education</a></p></div>
<ul style="flex: 2 1 420px; min-width: 0; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<template data-sc="for" list="{{pd.next}}" as="it" hint-placeholder-count="3"><li><label style="display: flex; gap: 12px; align-items: flex-start; min-height: 44px; background: rgba(255,255,255,.08); border-radius: 12px; padding: 12px 14px"><input type="checkbox" checked="{{it.done}}" onChange="{{it.toggle}}" style="flex: none; width: 22px; height: 22px; margin-top: 2px; accent-color: #F8D93A"><span><strong style="display: block; font-weight: 600">{{it.t}}</strong><span style="font-size: 14px">{{it.phase}}</span></span></label></li></template>
</ul>
</section>
</template>
<section aria-labelledby="dash-week" style="background: #FFFFFF; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; gap: 12px"><span style="font-family: Geist, sans-serif; font-weight: 800; font-size: 54px; line-height: 1; color: #1E4ADD">{{curWeek.n}}</span><h2 id="dash-week" style="margin: 0; font-family: Geist, sans-serif; font-weight: 600; font-size: 22px; line-height: 1.2">This week: {{curWeek.title}}</h2></div>
<template data-sc="for" list="{{curWeek.next}}" as="it" hint-placeholder-count="3">
<label style="display: flex; gap: 12px; align-items: flex-start; min-height: 44px; background: #F4F6FE; border-radius: 12px; padding: 12px 14px">
<input type="checkbox" checked="{{it.done}}" onChange="{{it.toggle}}" style="flex: none; width: 22px; height: 22px; margin-top: 2px; accent-color: #1E4ADD">
<span><strong style="display: block; font-weight: 600">{{it.title}}</strong><span style="font-size: 14px">{{it.short}}</span></span>
</label>
</template>
<template data-sc="if" value="{{curWeek.allDone}}" hint-placeholder-val="{{false}}"><p style="margin: 0; background: #FFF3CC; border-radius: 12px; padding: 12px 14px; font-weight: 500">Week {{curWeek.n}} is done. Move on to the next week when you are ready.</p></template>
<button class="btn ind" style="margin-top: auto; align-self: flex-start" onClick="{{go.roadmap}}">Open the full roadmap</button>
</section>

<section aria-labelledby="dash-hours" style="background: #FFFFFF; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px">
<h2 id="dash-hours" style="margin: 0; font-family: Geist, sans-serif; font-weight: 600; font-size: 22px">Visa hours this week</h2>
<p style="margin: 0; font-size: 15px">{{wkNow.label}}, all jobs added together</p>
<div style="display: flex; align-items: baseline; gap: 10px"><span style="font-family: Geist, sans-serif; font-weight: 800; font-size: 64px; line-height: 1; color: #1E4ADD; letter-spacing: -0.03em">{{wkNow.total}}</span><span style="font-weight: 500">of {{wkNow.limitText}}</span></div>
<div aria-hidden="true" style="height: 12px; border-radius: 999px; background: #E5E9FB; overflow: hidden"><div style="height: 12px; border-radius: 999px; background: {{wkNow.visa.dot}}; width: {{wkNow.pct}}"></div></div>
<div role="status" aria-live="polite" style="display: flex; gap: 12px; align-items: flex-start; border-radius: 12px; padding: 12px 14px; background: {{wkNow.visa.bg}}; color: {{wkNow.visa.fg}}">
<span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: {{wkNow.visa.dot}}; color: {{wkNow.visa.dotFg}}; display: flex; align-items: center; justify-content: center; font-weight: 700">{{wkNow.visa.icon}}</span>
<span><strong style="display: block; font-weight: 600">{{wkNow.visa.title}}</strong><span style="font-size: 14px">{{wkNow.visa.text}}</span></span>
</div>
<button class="btn ind" style="margin-top: auto; align-self: flex-start" onClick="{{go.log}}">Log a shift</button>
</section>

<section aria-labelledby="dash-money" style="background: #14174F; color: #FFFFFF; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 8px">
<h2 id="dash-money" style="margin: 0; font-family: Geist, sans-serif; font-weight: 600; font-size: 22px">{{balanceLabel}}</h2>
<p style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; font-size: clamp(48px, 5vw, 64px); line-height: 1; letter-spacing: -0.03em; color: {{balanceColor}}">{{balance}}</p>
<p style="margin: 4px 0 0; font-size: 15px">From {{hours}} hours a week at £{{rateText}}, after estimated tax and your costs of {{costsPlain}}.</p>
<button class="btn sun" style="margin-top: auto; align-self: flex-start" onClick="{{go.budget}}">Adjust your budget</button>
</section>

<section aria-labelledby="dash-jobs" style="background: #FFFFFF; border-radius: 16px; padding: 28px; grid-column: 1 / -1">
<div style="display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; justify-content: space-between">
<h2 id="dash-jobs" style="margin: 0; font-family: Geist, sans-serif; font-weight: 600; font-size: 26px">Jobs near {{profile.city}} that pass the visa check</h2>
<button class="btn outline" onClick="{{seeCityJobs}}">See all {{cityJobCount}} in {{profile.city}}</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 18px">
<template data-sc="for" list="{{dashJobs}}" as="j" hint-placeholder-count="3">
<a href="{{j.url}}" target="_blank" rel="noopener" class="lift" style="display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: #14174F; background: #F4F6FE; border-radius: 16px; padding: 20px">
<span style="font-family: Geist, sans-serif; font-weight: 600; font-size: 18px; line-height: 1.25; color: #1E4ADD">{{j.title}}</span>
<span style="font-size: 15px">{{j.employer}}, {{j.loc}}</span>
<span style="font-size: 15px; font-weight: 600">{{j.pay}}</span>
</a>
</template>
</div>
<template data-sc="if" value="{{appsAny}}" hint-placeholder-val="{{false}}">
<p style="margin: 18px 0 0; font-weight: 500">Your applications: {{appsSummary}}</p>
</template>
</section>
<section aria-labelledby="dash-settle" style="background: #FFFFFF; border-radius: 16px; padding: 28px; grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between">
<div style="flex: 1 1 420px; min-width: 0"><h2 id="dash-settle" style="margin: 0; font-family: Geist, sans-serif; font-weight: 700; font-size: 24px">Settle in: {{settle.short}}</h2><p style="margin: 6px 0 0">Council Tax exemption, GP, Railcard, deposit protection and the scams to avoid.</p></div>
<button class="btn ind" onClick="{{go.settle}}">Open the settle-in guide</button>
</section>
<section aria-labelledby="dash-grad" style="background: #F8D93A; border-radius: 16px; padding: 28px; grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between">
<div style="flex: 1 1 420px; min-width: 0"><h2 id="dash-grad" style="margin: 0; font-family: Geist, sans-serif; font-weight: 700; font-size: 24px">{{stayCard.title}}</h2><p style="margin: 6px 0 0">{{stayCard.text}}</p></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px"><button class="btn ind" onClick="{{agGo.pack}}">Open my Graduate route pack</button><button class="btn outline" onClick="{{agGo.alerts}}">Sponsor job alerts</button></div>
</section>
</div>
</main>
</template>

<!-- ============ BEFORE YOU FLY ============ -->
<template data-sc="if" value="{{isPredep}}" hint-placeholder-val="{{false}}">
<main style="background: #F5F6FB; padding-bottom: 80px">
<section style="background: #0B1440; color: #FFFFFF; padding: clamp(28px, 4vw, 52px) clamp(16px, 4vw, 40px)">
<div style="max-width: 1240px; margin: 0 auto">
<p style="margin: 0 0 8px; font-weight: 700; color: #F8D93A">Arrive. Start here if you are still at home.</p>
<h1 style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; font-size: clamp(36px, 5vw, 68px); line-height: 1; letter-spacing: -0.035em">Before you fly</h1>
<p style="margin: 14px 0 0; max-width: 44em; font-size: 18px">The essential steps between your offer and the UK border, in four stages. Add your dates and your country: the plan shows what to do now and hides steps that don’t apply to you.</p>
<form onSubmit="{{noSubmit}}" style="margin-top: 22px; background: rgba(255,255,255,.08); border-radius: 16px; padding: 16px; display: flex; flex-wrap: wrap; gap: 12px">
<div style="flex: 1 1 200px"><label for="pd-start" style="display: block; font-weight: 600; margin-bottom: 6px">Course start date</label><input id="pd-start" class="field" type="date" value="{{pd.start}}" onChange="{{pd.setStart}}" onInput="{{pd.setStart}}"></div>
<div style="flex: 1 1 200px"><label for="pd-fly" style="display: block; font-weight: 600; margin-bottom: 6px">Flight date, if booked</label><input id="pd-fly" class="field" type="date" value="{{pd.fly}}" onChange="{{pd.setFly}}" onInput="{{pd.setFly}}"></div>
<div style="flex: 1 1 220px"><label for="pd-country" style="display: block; font-weight: 600; margin-bottom: 6px">Home country</label><select id="pd-country" class="field" autocomplete="country-name" value="{{country}}" onChange="{{setCountry}}"><option value="">Choose your country</option><template data-sc="for" list="{{countryOpts}}" as="c" hint-placeholder-count="5"><option value="{{c}}">{{c}}</option></template></select></div>
</form>
<dl style="margin: 16px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<template data-sc="for" list="{{pd.tiles}}" as="x" hint-placeholder-count="4"><div style="background: rgba(255,255,255,.08); border-radius: 12px; padding: 14px 16px"><dt style="font-size: 14px">{{x.t}}</dt><dd style="margin: 4px 0 0; font-family: Geist, sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em; color: #F8D93A">{{x.v}}</dd><dd style="margin: 2px 0 0; font-size: 13px; color: #DCE3FF">{{x.d}}</dd></div></template>
</dl>
<template data-sc="if" value="{{em.pre.show}}" hint-placeholder-val="{{true}}">
<form novalidate onSubmit="{{em.pre.submit}}" style="margin-top: 16px; background: {{em.pre.bg}}; color: {{em.pre.fg}}; border-radius: 14px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end">
<div style="flex: 1 1 260px; min-width: 0"><p style="margin: 0 0 6px; font-weight: 700">Get an email before each date</p><label for="em-pre" style="display: block; font-size: 14px; margin-bottom: 6px">{{em.pre.line}}</label><input id="em-pre" class="field" type="email" autocomplete="email" placeholder="you@email.com" value="{{em.pre.email}}" onChange="{{em.setEmail}}" onInput="{{em.setEmail}}"></div>
<button type="submit" class="btn sun" style="flex: 0 1 auto">Email me reminders</button>
<p role="status" aria-live="polite" style="margin: 0; flex: 1 1 100%; font-size: 14px; font-weight: 600">{{em.pre.msg}}</p>
<p style="margin: 0; flex: 1 1 100%; font-size: 12px; opacity: .85">We only use your email for these reminders and UniWork news. Stop them any time.</p>
</form>
</template>
<div style="margin-top: 16px; max-width: 46em; background: rgba(255,255,255,.12); border-radius: 12px; padding: 12px 16px"><p style="margin: 0; font-size: 14px">Checked against GOV.UK on 13 November 2026. General information, not immigration advice: fees and rules change, so confirm on <a style="color: #F8D93A" href="https://www.gov.uk/student-visa" target="_blank" rel="noopener">GOV.UK</a> or with your university before you apply.</p></div>
</div>
</section>
<div style="max-width: 1240px; margin: 0 auto; padding: 28px clamp(16px, 4vw, 40px) 0; display: flex; flex-direction: column; gap: 20px">
<section aria-labelledby="gte-h" style="background: #FFFFFF; border: 3px solid #1E4ADD; border-radius: 16px; padding: clamp(18px, 2.6vw, 28px); display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center">
<div style="flex: 1 1 460px; min-width: 0">
<p style="margin: 0 0 6px; font-weight: 800; color: #1E4ADD">No offer letter (LoA), CAS or visa yet?</p>
<h2 id="gte-h" style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; font-size: clamp(24px, 2.6vw, 30px)">Get help applying with Global Talent Education</h2>
<p style="margin: 8px 0 0; font-size: 15px">The team behind UniWork helps you choose a university and course, apply until you receive your offer letter (LoA), and check your Student visa documents before you submit. The first consultation is free.</p>
<ul style="margin: 10px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px"><li>University and course choice, and your application up to the LoA</li><li>Personal statement and CV review, and interview practice for scholarships</li><li>A check of your visa documents before you apply</li></ul>
</div>
<div style="flex: 0 1 280px; display: flex; flex-direction: column; gap: 8px">
<a class="btn ind" href="https://www.globaltalent-education.com" target="_blank" rel="noopener" onClick="{{gteClick}}" style="text-align: center">Book a free consultation</a>
<a href="https://globaltalent-education.com/kontak.html" target="_blank" rel="noopener" onClick="{{gteClick}}" style="font-size: 14px; font-weight: 700; text-align: center">Other ways to contact GTE</a>
<p style="margin: 0; font-size: 13px; color: #4A4F86; text-align: center">www.globaltalent-education.com · website in Bahasa Indonesia</p>
</div>
</section>
<template data-sc="for" list="{{pd.phases}}" as="ph" hint-placeholder-count="4">
<section style="background: #FFFFFF; border: 3px solid {{ph.border}}; border-radius: 16px; padding: clamp(18px, 2.6vw, 28px)">
<div style="display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between">
<h2 style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; font-size: 24px"><span style="color: #1E4ADD">{{ph.n}}.</span> {{ph.title}}</h2>
<p style="margin: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center"><template data-sc="if" value="{{ph.now}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; font-weight: 800; background: #F8D93A; color: #0B1440; border-radius: 999px; padding: 4px 12px">Do this now</span></template><span style="font-weight: 700; color: #1E4ADD">{{ph.count}}</span></p>
</div>
<p style="margin: 6px 0 14px; font-size: 15px; color: #4A4F86">{{ph.when}}</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 10px">
<template data-sc="for" list="{{ph.items}}" as="it" hint-placeholder-count="3">
<div style="background: {{it.bg}}; border-radius: 12px; padding: 12px 14px">
<label style="display: flex; gap: 12px; align-items: flex-start; min-height: 44px"><input type="checkbox" checked="{{it.done}}" onChange="{{it.toggle}}" style="flex: none; width: 22px; height: 22px; margin-top: 2px; accent-color: #1E4ADD"><span><strong style="display: block; font-weight: 700">{{it.t}}</strong><span style="font-size: 14px">{{it.d}}</span></span></label>
<template data-sc="if" value="{{it.hasPts}}" hint-placeholder-val="{{true}}"><ul style="margin: 8px 0 0 34px; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px"><template data-sc="for" list="{{it.pts}}" as="x" hint-placeholder-count="3"><li>{{x}}</li></template></ul></template>
<template data-sc="if" value="{{it.hasLinks}}" hint-placeholder-val="{{false}}"><p style="margin: 8px 0 0 34px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px"><template data-sc="for" list="{{it.links}}" as="c" hint-placeholder-count="1"><a href="{{c.url}}" target="_blank" rel="noopener" onClick="{{c.click}}" style="font-weight: 700">{{c.label}}</a></template></p></template>
</div>
</template>
</div>
</section>
</template>
<section style="background: #1E4ADD; color: #FFFFFF; border-radius: 18px; padding: clamp(20px, 3vw, 32px); display: flex; flex-wrap: wrap; gap: 14px 32px; align-items: center">
<div style="flex: 1 1 420px; min-width: 0"><h2 style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; font-size: 26px; color: #F8D93A">Landed in the UK?</h2><p style="margin: 8px 0 0; font-size: 16px">Switch to your first four weeks: SIM, bank account, National Insurance number, share code and your first job applications.</p></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px"><button class="btn sun" onClick="{{pd.arrived}}">I have arrived</button><button class="btn outline" onClick="{{go.mentor}}">Talk to a mentor first</button></div>
</section>
</div>
</main>
</template>

<!-- ============ SETTLE IN ============ -->
<template data-sc="if" value="{{isSettle}}" hint-placeholder-val="{{false}}">
<main style="background: #F5F6FB; padding-bottom: 72px">
<section style="background: #1E4ADD; color: #FFFFFF; padding: clamp(28px, 4vw, 52px) clamp(16px, 4vw, 40px)">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: center">
<div style="flex: 2 1 440px; min-width: 0">
<p style="margin: 0 0 6px; font-weight: 700">Arrive.</p>
<h1 style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; font-size: clamp(36px, 5vw, 68px); line-height: 1; letter-spacing: -0.03em; color: #F8D93A">Settle in</h1>
<p style="margin: 14px 0 0; max-width: 36em; font-size: 18px">Four must-dos for life beyond the job, plus short tips for health, home, money, travel and safety.</p>
<p role="status" aria-live="polite" style="margin: 14px 0 0; font-weight: 700">{{settle.progress}}</p>
</div>
<dl style="flex: 1 1 300px; min-width: 0; margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="background: #C0152F; border-radius: 12px; padding: 14px"><dd style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; font-size: 32px; line-height: 1">999</dd><dt style="font-size: 13px; margin-top: 4px">Emergency: police, fire, ambulance</dt></div>
<div style="background: #FFFFFF; color: #14174F; border-radius: 12px; padding: 14px"><dd style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; font-size: 32px; line-height: 1">111</dd><dt style="font-size: 13px; margin-top: 4px">NHS urgent medical advice</dt></div>
<div style="background: #F8D93A; color: #14174F; border-radius: 12px; padding: 14px"><dd style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; font-size: 32px; line-height: 1">101</dd><dt style="font-size: 13px; margin-top: 4px">Police, not an emergency</dt></div>
</dl>
</div>
</section>
<div style="max-width: 1240px; margin: 24px auto 0; padding: 0 clamp(16px, 4vw, 40px); display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; align-items: start">
<template data-sc="for" list="{{settle.topics}}" as="t" hint-placeholder-count="6">
<section style="background: #FFFFFF; border: 1px solid #E3E7F5; border-top: 6px solid {{t.color}}; border-radius: 14px; padding: 20px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px"><h2 style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; font-size: 22px">{{t.title}}</h2><span style="font-size: 13px; font-weight: 700; color: #1E4ADD; white-space: nowrap">{{t.count}}</span></div>
<template data-sc="if" value="{{t.hasItems}}" hint-placeholder-val="{{true}}"><ul style="list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<template data-sc="for" list="{{t.items}}" as="it" hint-placeholder-count="2">
<li style="background: {{it.bg}}; border-radius: 10px; padding: 10px 12px">
<label style="display: flex; gap: 12px; align-items: flex-start"><input type="checkbox" checked="{{it.done}}" onChange="{{it.toggle}}" style="flex: none; width: 22px; height: 22px; margin-top: 2px; accent-color: #1E4ADD"><span><strong style="display: block; font-weight: 700">{{it.title}}</strong><span style="font-size: 14px">{{it.body}}</span><template data-sc="if" value="{{it.hasLink}}" hint-placeholder-val="{{false}}"> <a href="{{it.url}}" target="_blank" rel="noopener" style="font-size: 14px; font-weight: 700">{{it.linkLabel}}</a></template></span></label>
</li>
</template>
</ul></template>
<p style="margin: 14px 0 6px; font-size: 13px; font-weight: 700; color: #4A4F86">Good to know</p>
<ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px">
<template data-sc="for" list="{{t.tips}}" as="tp" hint-placeholder-count="3"><li>{{tp.t}}<template data-sc="if" value="{{tp.hasLink}}" hint-placeholder-val="{{false}}"> <a href="{{tp.url}}" target="_blank" rel="noopener" onClick="{{tp.click}}" style="font-weight: 700">{{tp.label}}</a></template></li></template>
</ul>
</section>
</template>
</div>
<div style="max-width: 1240px; margin: 24px auto 0; padding: 0 clamp(16px, 4vw, 40px)"><div style="background: #14174F; color: #FFFFFF; border-radius: 14px; padding: 24px; display: flex; flex-wrap: wrap; gap: 14px 32px; align-items: center; justify-content: space-between"><p style="margin: 0; flex: 1 1 380px; font-size: 17px"><strong style="color: #F8D93A">Next: get ready to work.</strong> Bank account, National Insurance number, share code and a UK CV, week by week.</p><button class="btn sun" onClick="{{go.roadmap}}">Open the work-ready checklist</button></div></div>
</main>
</template>

<!-- ============ ROADMAP ============ -->
<template data-sc="if" value="{{isRoadmap}}" hint-placeholder-val="{{false}}">
<main style="background: #FFFFFF; padding-bottom: 80px">
<section style="background: #1E4ADD; color: #FFFFFF; position: relative; overflow: hidden; padding: clamp(32px, 5vw, 64px) clamp(16px, 4vw, 56px)">
<div aria-hidden="true" style="position: absolute; right: -120px; top: -230px; width: 420px; height: 420px; border-radius: 50%; background: #FFFFFF"></div>
<div aria-hidden="true" style="position: absolute; right: -120px; top: 200px; width: 420px; height: 420px; border-radius: 50%; background: #FFFFFF"></div>
<div style="position: relative; max-width: 1280px; margin: 0 auto; padding-right: clamp(0px, 22vw, 300px)">

</div>
</div>
</article>
</template>
<section aria-label="Good to know" style="border: 1px solid #E3E7F5; border-radius: 14px; padding: 16px 18px">

<template data-sc="for" list="{{wk.tips}}" as="tp" hint-placeholder-count="2"><li>{{tp.t}}<template data-sc="if" value="{{tp.hasLink}}" hint-placeholder-val="{{false}}"> <a href="{{tp.url}}" target="_blank" rel="noopener" style="font-weight: 700">{{tp.linkLabel}}</a></template><template data-sc="if" value="{{tp.hasAction}}" hint-placeholder-val="{{false}}"> <button onClick="{{tp.act}}" style="background: none; border: none; padding: 0; font-size: 15px; font-weight: 700; color: #1E4ADD; text-decoration: underline; text-underline-offset: 3px">{{tp.actionLabel}}</button></template></li></template>
</ul>

<template data-sc="if" value="{{wk.isW4}}" hint-placeholder-val="{{false}}">
<section aria-labelledby="hmrc" style="background: #14174F; color: #FFFFFF; border-radius: 16px; padding: 26px">
<h3 id="hmrc" style="margin: 0 0 12px; font-family: Geist, sans-serif; font-weight: 600; font-size: 20px; color: #F8D93A">How tax works on a student wage</h3>
<table style="width: 100%; border-collapse: collapse; font-size: 15px">
<thead><tr><th scope="col" style="text-align: left; padding: 8px 0; border-bottom: 1px solid #3A3F86; font-weight: 600">Yearly pay</th><th scope="col" style="text-align: right; padding: 8px 0; border-bottom: 1px solid #3A3F86; font-weight: 600">Income tax</th></tr></thead>
<tbody>
<tr><td style="padding: 8px 0; border-bottom: 1px solid #3A3F86">Up to £12,570</td><td style="padding: 8px 0; border-bottom: 1px solid #3A3F86; text-align: right">0%</td></tr>
<tr><td style="padding: 8px 0; border-bottom: 1px solid #3A3F86">£12,571 to £50,270</td><td style="padding: 8px 0; border-bottom: 1px solid #3A3F86; text-align: right">20%</td></tr>
</tbody>
</table>
<p style="margin: 12px 0 0; font-size: 14px">National Insurance is 8% of pay above £242 a week. Scotland has its own income tax bands. A 20-hour week at £12.71 is about £13,200 a year, just above the allowance.</p>
</section>

<img src="images/caller.webp" alt="A smiling woman on the phone" style="display: block; width: 100%; max-width: 380px; height: auto">

</section>

</section>

<!-- ============ VISA RULES ============ -->
<template data-sc="if" value="{{isRules}}" hint-placeholder-val="{{false}}">
<main style="background: #E5FBFF; padding-bottom: 80px">
<section style="background: #1E4ADD; color: #FFFFFF; padding: clamp(32px, 5vw, 64px) clamp(16px, 4vw, 56px)">
<div style="max-width: 1280px; margin: 0 auto">
<h1 style="margin: 0; max-width: 13em; font-family: Geist, sans-serif; font-weight: 700; font-size: clamp(36px, 5vw, 72px); line-height: 1; letter-spacing: -0.03em; color: #F8D93A">Do and don’t on a Student visa</h1>
<p style="margin: 18px 0 0; max-width: 40em; font-size: 18px">Breaking a work condition can end your visa and affect future applications, and your university must report it. Your eVisa shows the conditions that apply to you.</p>
<div style="margin-top: 18px; max-width: 46em; background: rgba(255,255,255,.12); border-radius: 12px; padding: 12px 16px"><p style="margin: 0; font-size: 14px">UniWork gives general information, not immigration advice. Immigration advice in the UK is regulated by the <a style="color: #F8D93A" href="https://www.gov.uk/government/organisations/immigration-advice-authority" target="_blank" rel="noopener">Immigration Advice Authority</a>. For your own case, speak to your university’s international student adviser or a <a style="color: #F8D93A" href="https://www.gov.uk/find-an-immigration-adviser" target="_blank" rel="noopener">registered immigration adviser</a>.</p></div>
</div>
</section>
<div style="max-width: 1280px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 56px)">
<div style="display: flex; flex-wrap: wrap; gap: 24px; margin-top: -32px; align-items: flex-start">
<section style="flex: 1 1 360px; min-width: 0; background: #FFFFFF; border-radius: 16px; padding: clamp(24px, 3vw, 40px)">
<h2 style="margin: 0 0 20px; font-family: Geist, sans-serif; font-weight: 700; font-size: 32px; display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 50%; background: #F8D93A; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="24" height="24" style="fill: none; stroke: #14174F; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>Do</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; gap: 12px"><span style="flex: none; width: 128px; font-weight: 700; font-size: 15px">New entrant</span><span style="flex: 1 1 auto; height: 40px; background: #F5F6FB; border-radius: 8px; overflow: hidden"><span style="display: flex; align-items: center; justify-content: flex-end; padding-right: 12px; height: 100%; width: 80.1%; background: #F8D93A; color: #0B1440; font-weight: 800">£33,400</span></span></div>
</div>

<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px"><template data-sc="for" list="{{neWho}}" as="w" hint-placeholder-count="5"><li>{{w}}</li></template></ul></div>
<div><h3 style="margin: 0 0 10px; font-family: Geist, sans-serif; font-weight: 800; font-size: 20px">The limits people miss</h3>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px"><template data-sc="for" list="{{neLimits}}" as="w" hint-placeholder-count="4"><li>{{w}}</li></template></ul></div>
</div>
<h3 style="margin: 28px 0 12px; font-family: Geist, sans-serif; font-weight: 800; font-size: 20px">Three worked examples</h3>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px">
<template data-sc="for" list="{{neExamples}}" as="x" hint-placeholder-count="3"><div style="background: {{x.bg}}; border-radius: 12px; padding: 16px"><strong style="display: block; font-weight: 800; font-size: 17px">{{x.t}}</strong><span style="display: block; margin-top: 6px; font-size: 15px">{{x.d}}</span><strong style="display: block; margin-top: 8px; font-weight: 700; color: {{x.vc}}">{{x.v}}</strong></div></template>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px"><button class="btn ind" onClick="{{agGo.salary}}">Check my salary</button><button class="btn outline" onClick="{{agGo.offer}}">Check a job offer</button></div>
</section>

<section aria-labelledby="swreq-h" style="margin-top: 24px">
<h2 id="swreq-h" style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; font-size: clamp(26px, 3vw, 36px)">What a Skilled Worker visa needs</h2>
<p style="margin: 8px 0 16px; max-width: 44em">All five must be true. The salary is only one of them.</p>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<template data-sc="for" list="{{swNeeds}}" as="n" hint-placeholder-count="5"><li style="background: #FFFFFF; border: 1px solid #E3E7F5; border-top: 5px solid #1E4ADD; border-radius: 14px; padding: 16px"><strong style="display: block; font-family: Geist, sans-serif; font-weight: 800; font-size: 18px">{{n.t}}</strong><span style="display: block; margin-top: 6px; font-size: 15px">{{n.d}}</span></li></template>
</ol>
</section>

<section aria-labelledby="how-h" style="margin-top: 28px; background: #14174F; color: #FFFFFF; border-radius: 18px; padding: clamp(20px, 3vw, 36px)">
<h2 id="how-h" style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; font-size: clamp(26px, 3vw, 36px); color: #F8D93A">How to get sponsored, step by step</h2>
<ol style="margin: 18px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px">
<template data-sc="for" list="{{swSteps}}" as="st" hint-placeholder-count="6"><li style="display: flex; gap: 12px; background: rgba(255,255,255,.07); border-radius: 12px; padding: 14px"><span aria-hidden="true" style="flex: none; width: 34px; height: 34px; border-radius: 50%; background: #F8D93A; color: #0B1440; display: flex; align-items: center; justify-content: center; font-weight: 800">{{st.n}}</span><span><strong style="display: block; font-weight: 700">{{st.t}}</strong><span style="font-size: 15px">{{st.d}}</span></span></li></template>
</ol>
</section>

<section aria-labelledby="ov-h" style="margin-top: 28px">
<h2 id="ov-h" style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; font-size: clamp(26px, 3vw, 36px)">Other ways to stay and work</h2>
<p style="margin: 8px 0 16px; max-width: 44em">Not every route needs an employer. Compare them before you plan your job search.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px">
<template data-sc="for" list="{{visaRoutes}}" as="v" hint-placeholder-count="6"><article style="background: #FFFFFF; border: 1px solid #E3E7F5; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 8px">
<h3 style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; font-size: 19px">{{v.t}}</h3>
<p style="margin: 0"><span style="display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 700; background: {{v.tagBg}}; color: {{v.tagFg}}">{{v.tag}}</span></p>
<p style="margin: 0; font-size: 15px">{{v.d}}</p>
<p style="margin: 0; font-size: 14px; color: #4A4F86"><strong style="font-weight: 700; color: #14174F">Best for:</strong> {{v.best}}</p>
<a href="{{v.url}}" target="_blank" rel="noopener" style="margin-top: auto; font-weight: 700">{{v.link}}</a>
</article></template>
</div>
</section>
</template>

<template data-sc="if" value="{{agCompany}}" hint-placeholder-val="{{false}}">
<section aria-labelledby="cc-h" style="background: #FFFFFF; border: 1px solid #E3E7F5; border-radius: 16px; padding: clamp(20px, 2.6vw, 30px)">
<h2 id="cc-h" style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; font-size: clamp(26px, 3vw, 36px)">Company check</h2>
<p style="margin: 8px 0 0; max-width: 46em">Search every organisation on the Home Office register of licensed sponsors. Only these employers can give you a Certificate of Sponsorship. {{spMetaLine}}</p>
<form onSubmit="{{noSubmit}}" style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; align-items: flex-end">
<div style="flex: 3 1 280px; min-width: 0"><label for="sp-q" style="display: block; font-weight: 600; margin-bottom: 6px">Company name</label><input id="sp-q" class="field" type="search" placeholder="e.g. Deloitte, NHS, Tesco" value="{{spQ}}" onChange="{{setSpQ}}" onInput="{{setSpQ}}"></div>
<div style="flex: 1 1 180px; min-width: 0"><label for="sp-town" style="display: block; font-weight: 600; margin-bottom: 6px">Town or city</label><input id="sp-town" class="field" type="search" placeholder="Any" value="{{spTown}}" onChange="{{setSpTown}}" onInput="{{setSpTown}}"></div>
<div style="flex: 1 1 220px; min-width: 0"><label for="sp-route" style="display: block; font-weight: 600; margin-bottom: 6px">Visa route</label><select id="sp-route" class="field" value="{{spRoute}}" onChange="{{setSpRoute}}"><template data-sc="for" list="{{routeOptions}}" as="r" hint-placeholder-count="3"><option value="{{r}}">{{r}}</option></template></select></div>
<label style="display: flex; align-items: center; gap: 10px; min-height: 48px; font-weight: 600"><input type="checkbox" checked="{{spAOnly}}" onChange="{{toggleSpAOnly}}" style="width: 22px; height: 22px; accent-color: #1E4ADD">A-rated only</label>
</form>
<template data-sc="if" value="{{spVerdict.show}}" hint-placeholder-val="{{true}}">
<div role="status" aria-live="polite" style="margin-top: 18px; border-radius: 14px; padding: 16px 18px; background: {{spVerdict.bg}}; color: {{spVerdict.fg}}"><strong style="display: block; font-family: Geist, sans-serif; font-weight: 800; font-size: 19px">{{spVerdict.t}}</strong><span style="font-size: 15px">{{spVerdict.d}}</span></div>
</template>
<p role="status" aria-live="polite" style="margin: 18px 0 10px; font-weight: 700">{{spCount}}</p>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<template data-sc="for" list="{{sponsors}}" as="r" hint-placeholder-count="6"><li style="border: 1px solid #E3E7F5; border-radius: 12px; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center">
<div style="flex: 1 1 320px; min-width: 0"><strong style="display: block; font-weight: 700; font-size: 16px">{{r.n}}</strong><span style="font-size: 14px; color: #4A4F86">{{r.place}}</span></div>
<span style="flex: none; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; background: {{r.rBg}}; color: {{r.rFg}}">{{r.rating}}</span>
<span style="flex: 1 1 220px; min-width: 0; font-size: 14px">{{r.routes}}</span>
<span style="flex: none; display: flex; gap: 14px; font-size: 14px; font-weight: 700"><a href="{{r.ch}}" target="_blank" rel="noopener">Companies House</a><a href="{{r.jobs}}" target="_blank" rel="noopener">Their jobs</a></span>
</li></template>
</ul>
<template data-sc="if" value="{{spMore}}" hint-placeholder-val="{{false}}"><button class="btn outline" onClick="{{spShowMore}}" style="margin-top: 14px">Show 30 more</button></template>
<template data-sc="if" value="{{noSponsors}}" hint-placeholder-val="{{false}}"><div style="padding: 18px 0 0"><button class="btn ind" onClick="{{clearSponsors}}">Clear filters</button></div></template>
<p style="margin: 20px 0 0; font-size: 14px">A licence means the employer <em>can</em> sponsor, not that every job will be sponsored. Ask before you apply: “Do you sponsor Skilled Worker visas for this role?” B-rated sponsors are on a Home Office action plan and usually can’t assign new certificates until they are A-rated again. <a href="https://www.gov.uk/government/publications/register-of-licensed-sponsors-workers" target="_blank" rel="noopener">Register on GOV.UK</a></p>
</section>
</template>

<template data-sc="if" value="{{agOffer}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section aria-labelledby="of-h" style="flex: 1 1 440px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E7F5; border-radius: 16px; padding: clamp(20px, 2.6vw, 30px)">
<h2 id="of-h" style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; font-size: clamp(26px, 3vw, 36px)">Would a job offer qualify?</h2>
<p style="margin: 8px 0 18px">Five questions. The employer is checked against the sponsor register as you type.</p>
<form onSubmit="{{noSubmit}}" style="display: flex; flex-direction: column; gap: 16px">
<div><label for="of-co" style="display: block; font-weight: 600; margin-bottom: 6px">1. Employer name</label><input id="of-co" class="field" type="search" placeholder="As written on the offer" value="{{of.company}}" onChange="{{ofSet.company}}" onInput="{{ofSet.company}}"></div>
<div><label for="of-job" style="display: block; font-weight: 600; margin-bottom: 6px">2. What kind of job is it?</label><select id="of-job" class="field" value="{{of.job}}" onChange="{{ofSet.job}}"><template data-sc="for" list="{{ofJobOpts}}" as="o" hint-placeholder-count="4"><option value="{{o.v}}">{{o.l}}</option></template></select></div>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><div style="flex: 1 1 180px"><label for="of-sal" style="display: block; font-weight: 600; margin-bottom: 6px">3. Yearly salary (£)</label><input id="of-sal" class="field" type="number" min="0" step="100" inputmode="numeric" placeholder="e.g. 34000" value="{{of.salary}}" onChange="{{ofSet.salary}}" onInput="{{ofSet.salary}}"></div>
<div style="flex: 1 1 180px"><label for="of-gr" style="display: block; font-weight: 600; margin-bottom: 6px">Going rate for the job (£, optional)</label><input id="of-gr" class="field" type="number" min="0" step="100" inputmode="numeric" placeholder="From the going rates table" value="{{of.going}}" onChange="{{ofSet.going}}" onInput="{{ofSet.going}}"></div></div>
<div><label for="of-ne" style="display: block; font-weight: 600; margin-bottom: 6px">4. Which of these is true for you?</label><select id="of-ne" class="field" value="{{of.ne}}" onChange="{{ofSet.ne}}"><template data-sc="for" list="{{neOpts}}" as="o" hint-placeholder-count="5"><option value="{{o.v}}">{{o.l}}</option></template></select></div>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 600"><input type="checkbox" checked="{{of.english}}" onChange="{{ofToggleEnglish}}" style="width: 22px; height: 22px; accent-color: #1E4ADD">5. My degree was taught in English, or I have a B2 English test</label>
</form>
</section>
<section aria-labelledby="ofv-h" role="status" aria-live="polite" style="flex: 1 1 380px; min-width: 0; background: {{ofv.bg}}; color: {{ofv.fg}}; border-radius: 16px; padding: clamp(20px, 2.6vw, 30px)">
<h2 id="ofv-h" style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; font-size: 26px">{{ofv.t}}</h2>
<p style="margin: 6px 0 14px; font-size: 15px">{{ofv.d}}</p>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<template data-sc="for" list="{{ofv.items}}" as="i" hint-placeholder-count="5"><li style="display: flex; gap: 12px; align-items: flex-start; background: #FFFFFF; color: #14174F; border-radius: 12px; padding: 12px 14px"><span style="flex: none; min-width: 64px; text-align: center; border-radius: 999px; padding: 2px 8px; font-size: 13px; font-weight: 800; background: {{i.bg}}; color: {{i.fg}}">{{i.tag}}</span><span><strong style="display: block; font-weight: 700">{{i.t}}</strong><span style="font-size: 14px">{{i.d}}</span></span></li></template>
</ul>
<p style="margin: 14px 0 0; font-size: 13px">A guide, not immigration advice. The employer confirms eligibility when it assigns your certificate.</p>
<template data-sc="if" value="{{ofv.help}}" hint-placeholder-val="{{false}}"><div style="margin-top: 14px; background: #FFFFFF; color: #14174F; border-radius: 12px; padding: 14px 16px"><p style="margin: 0; font-size: 15px"><strong style="font-weight: 800">Not sure what to do next?</strong> A mentor who went through the same switch can help you plan how to negotiate, or which roles to target instead. Career guidance, not immigration advice.</p><button class="btn ind" onClick="{{go.mentor}}" style="margin-top: 10px">Talk it through with a mentor</button></div></template>
</section>
</div>
</template>

<template data-sc="if" value="{{agSalary}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section aria-labelledby="sc-h" style="flex: 1 1 400px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E7F5; border-radius: 16px; padding: clamp(20px, 2.6vw, 30px)">
<h2 id="sc-h" style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; font-size: clamp(26px, 3vw, 36px)">Salary check</h2>
<p style="margin: 8px 0 18px">Your minimum is the <strong>higher</strong> of a fixed floor and a share of the job’s going rate. Find the going rate for your occupation code in the <a href="https://www.gov.uk/guidance/immigration-rules/immigration-rules-appendix-skilled-occupations" target="_blank" rel="noopener">Skilled Occupations table</a>.</p>
<form onSubmit="{{noSubmit}}" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; gap: 12px"><div style="flex: 1 1 170px"><label for="sc-sal" style="display: block; font-weight: 600; margin-bottom: 6px">Salary offered (£ a year)</label><input id="sc-sal" class="field" type="number" min="0" step="100" inputmode="numeric" placeholder="e.g. 34000" value="{{sc.salary}}" onChange="{{scSet.salary}}" onInput="{{scSet.salary}}"></div>
<div style="flex: 1 1 140px"><label for="sc-hrs" style="display: block; font-weight: 600; margin-bottom: 6px">Hours a week</label><input id="sc-hrs" class="field" type="number" min="1" max="80" step="0.5" inputmode="decimal" value="{{sc.hours}}" onChange="{{scSet.hours}}" onInput="{{scSet.hours}}"></div></div>
<div><label for="sc-gr" style="display: block; font-weight: 600; margin-bottom: 6px">Going rate for the occupation (£ a year, 37.5 hours)</label><input id="sc-gr" class="field" type="number" min="0" step="100" inputmode="numeric" placeholder="Leave empty if you don’t know it yet" value="{{sc.going}}" onChange="{{scSet.going}}" onInput="{{scSet.going}}"></div>
<fieldset style="border: none; margin: 0; padding: 0"><legend style="font-weight: 600; margin-bottom: 8px">Which rate applies to you?</legend>
<div style="display: flex; flex-direction: column; gap: 6px"><template data-sc="for" list="{{scRates}}" as="r" hint-placeholder-count="5"><label style="display: flex; gap: 10px; align-items: flex-start; border: 2px solid {{r.border}}; background: {{r.bg}}; border-radius: 12px; padding: 10px 12px; cursor: pointer"><input type="radio" name="sc-rate" checked="{{r.on}}" onChange="{{r.pick}}" style="width: 20px; height: 20px; margin-top: 3px; accent-color: #1E4ADD"><span><strong style="display: block; font-weight: 700">{{r.l}}</strong><span style="font-size: 14px">{{r.d}}</span></span></label></template></div>
</fieldset>
</form>
</section>
<section aria-labelledby="scr-h" role="status" aria-live="polite" style="flex: 1 1 380px; min-width: 0; background: #14174F; color: #FFFFFF; border-radius: 16px; padding: clamp(20px, 2.6vw, 30px)">
<h2 id="scr-h" style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; font-size: 26px; color: #F8D93A">Your minimum</h2>
<p style="margin: 6px 0 0; font-family: Geist, sans-serif; font-weight: 800; font-size: clamp(40px, 5vw, 60px); letter-spacing: -0.04em; line-height: 1">{{scr.min}}</p>
<p style="margin: 6px 0 0; font-size: 15px">{{scr.how}}</p>
<div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px">
<template data-sc="for" list="{{scr.bars}}" as="b" hint-placeholder-count="3"><div><div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600"><span>{{b.l}}</span><span>{{b.v}}</span></div><div aria-hidden="true" style="height: 14px; background: rgba(255,255,255,.12); border-radius: 999px; overflow: hidden; margin-top: 4px"><div style="height: 100%; width: {{b.w}}; background: {{b.c}}; border-radius: 999px"></div></div></div></template>
</div>
<div style="margin-top: 18px; border-radius: 12px; padding: 14px 16px; background: {{scr.vBg}}; color: {{scr.vFg}}"><strong style="display: block; font-weight: 800; font-size: 18px">{{scr.v}}</strong><span style="font-size: 14px">{{scr.vd}}</span></div>
<dl style="margin: 16px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
<template data-sc="for" list="{{scr.facts}}" as="f" hint-placeholder-count="2"><div style="background: rgba(255,255,255,.07); border-radius: 10px; padding: 10px 12px"><dt style="font-size: 13px">{{f.t}}</dt><dd style="margin: 2px 0 0; font-weight: 800; font-size: 18px">{{f.v}}</dd></div></template>
</dl>
<p style="margin: 14px 0 0; font-size: 13px">Going rates assume 37.5 hours a week and are adjusted for other hours; the fixed floors are not. Only guaranteed basic pay counts, not overtime or most allowances. Since April 2026 pay is checked in every pay period, not just as a yearly total.</p>
</section>
</div>
</template>

</div>
</main>
</template>

<!-- ============ MONEY ============ -->
<template data-sc="if" value="{{isMoney}}" hint-placeholder-val="{{false}}">
<main style="background: #F5F6FB; padding-bottom: 80px">
<section style="background: #1E4ADD; color: #FFFFFF; padding: clamp(28px, 4vw, 52px) clamp(16px, 4vw, 40px) 0">
<div style="max-width: 1240px; margin: 0 auto">
<p style="margin: 0 0 8px; font-weight: 700; color: #F8D93A">Money.</p>
<h1 style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; font-size: clamp(36px, 5vw, 68px); line-height: 1; letter-spacing: -0.035em">Your student money plan</h1>
<p style="margin: 14px 0 0; max-width: 44em; font-size: 18px">The only budget built around a Student visa: your hour limit, money from home in any currency, and the cost of staying after you graduate.</p>
<dl style="margin: 22px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; max-width: 620px">
<template data-sc="for" list="{{moneyStats}}" as="m" hint-placeholder-count="3"><div style="background: {{m.bg}}; color: {{m.fg}}; border-radius: 14px; padding: 14px 16px"><dt style="font-size: 14px; font-weight: 600">{{m.t}}</dt><dd style="margin: 4px 0 0; font-family: Geist, sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.03em; line-height: 1">{{m.v}}</dd></div></template>
</dl>
<nav aria-label="Budget sections" class="onbstrip" style="margin-top: 26px; gap: 4px"><template data-sc="for" list="{{mnTabs}}" as="t" hint-placeholder-count="5"><button onClick="{{t.go}}" aria-current="{{t.current}}" style="flex: none; min-height: 52px; padding: 0 18px; border: none; border-radius: 12px 12px 0 0; background: {{t.bg}}; color: {{t.fg}}; font-size: 15px; font-weight: 700">{{t.label}}</button></template></nav>
</div>
</section>
<div style="max-width: 1240px; margin: 0 auto; padding: 28px clamp(16px, 4vw, 40px) 0">

<template data-sc="if" value="{{mnPlan}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<form onSubmit="{{noSubmit}}" style="flex: 1 1 400px; min-width: 0; background: #E5FBFF; border-radius: 16px; padding: clamp(20px, 3vw, 36px); display: flex; flex-direction: column; gap: 22px">
<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px">
<legend style="padding: 0; margin-bottom: 12px; font-family: Geist, sans-serif; font-weight: 600; font-size: 22px; color: #1E4ADD">Your work</legend>
<div role="group" aria-label="Time of year" style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-sc="for" list="{{periods}}" as="p" hint-placeholder-count="2"><button type="button" onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; font-size: 15px; font-weight: 500; border: 2px solid #1E4ADD; background: {{p.bg}}; color: {{p.fg}}">{{p.label}}</button></template>

<div style="display: flex; flex-wrap: wrap; gap: 12px"><div style="flex: 1 1 160px"><label for="mt-country" style="display: block; font-weight: 600; margin-bottom: 6px">From</label><select id="mt-country" class="field" autocomplete="country-name" value="{{country}}" onChange="{{setCountry}}"><option value="">Choose your country</option><template data-sc="for" list="{{countryOpts}}" as="c" hint-placeholder-count="5"><option value="{{c}}">{{c}}</option></template></select></div><div style="flex: 1 1 160px"><label for="mt-lang" style="display: block; font-weight: 600; margin-bottom: 6px">Language</label><select id="mt-lang" class="field" value="{{mt.language}}" onChange="{{mtSet.language}}"><template data-sc="for" list="{{mtv.langs}}" as="l" hint-placeholder-count="2"><option value="{{l}}">{{l}}</option></template></select></div></div>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><div style="flex: 1 1 200px"><label for="mt-uni" style="display: block; font-weight: 600; margin-bottom: 6px">University</label><input id="mt-uni" class="field" value="{{mt.university}}" onChange="{{mtSet.university}}" onInput="{{mtSet.university}}"></div><div style="flex: 1 1 200px"><label for="mt-topic" style="display: block; font-weight: 600; margin-bottom: 6px">Main topic</label><select id="mt-topic" class="field" value="{{mt.topic}}" onChange="{{mtSet.topic}}"><template data-sc="for" list="{{mentorTopicOpts}}" as="o" hint-placeholder-count="5"><option value="{{o}}">{{o}}</option></template></select></div></div>
<div><label for="mt-times" style="display: block; font-weight: 600; margin-bottom: 6px">Times that suit you (UK time)</label><input id="mt-times" class="field" placeholder="e.g. weekday evenings, Saturday morning" value="{{mt.times}}" onChange="{{mtSet.times}}" onInput="{{mtSet.times}}"></div>
<div><label for="mt-notes" style="display: block; font-weight: 600; margin-bottom: 6px">What do you want to leave with? (optional)</label><textarea id="mt-notes" class="field" rows="3" style="padding: 12px 14px; min-height: 96px" onChange="{{mtSet.notes}}" onInput="{{mtSet.notes}}">{{mt.notes}}</textarea></div>
<template data-sc="if" value="{{mtv.wait}}" hint-placeholder-val="{{false}}">
<p role="note" style="margin: 0; background: #FFF3CC; border-radius: 12px; padding: 12px 14px; font-size: 15px">{{mtv.waitText}}</p>
<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 15px"><input type="checkbox" checked="{{mt.canMentor}}" onChange="{{mtToggleCanMentor}}" style="flex: none; width: 22px; height: 22px; margin-top: 2px; accent-color: #1E4ADD"><span>I have studied or worked in the UK for a year or more and would like to become a mentor.</span></label>
</template>
<p role="status" aria-live="polite" style="margin: 0; font-weight: 600; color: {{mtMsgColor}}">{{mtMsg}}</p>
<button type="submit" class="btn ind" style="align-self: flex-start">{{mtv.cta}}</button>
</form>
</section>
</div>
<div style="margin-top: 24px; background: #FFF3CC; border-radius: 14px; padding: 16px 20px"><p style="margin: 0; font-size: 14px">Mentors share their own experience and career guidance. They do not give immigration advice. Immigration advice in the UK is regulated by the <a href="https://www.gov.uk/government/organisations/immigration-advice-authority" target="_blank" rel="noopener">Immigration Advice Authority</a>. For your own case, speak to your university’s international student adviser or a <a href="https://www.gov.uk/find-an-immigration-adviser" target="_blank" rel="noopener">registered immigration adviser</a>.</p></div>
</div>
</main>
</template>

<!-- ============ PARTNERS ============ -->
<template data-sc="if" value="{{isPartners}}" hint-placeholder-val="{{false}}">
<main style="background: #F5F6FB; padding-bottom: 80px">
<section style="background: #1E4ADD; color: #FFFFFF; padding: clamp(28px, 4vw, 52px) clamp(16px, 4vw, 40px)">
<div style="max-width: 1240px; margin: 0 auto">
<p style="margin: 0 0 8px; font-weight: 700; color: #F8D93A">Money. Deals for your first year in the UK</p>
<h1 style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; font-size: clamp(36px, 5vw, 64px); line-height: 1; letter-spacing: -0.035em">Partner deals</h1>
<p style="margin: 14px 0 0; max-width: 44em; font-size: 18px">A bank account, money from home, a room, bills, essentials and cheap food. Each deal says when you need it and what to watch out for.</p>
<h2 style="margin: 26px 0 12px; font-family: Geist, sans-serif; font-weight: 800; letter-spacing: -0.02em; font-size: 22px; color: #F8D93A">{{deals.pickTitle}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px">
<template data-sc="for" list="{{deals.picks}}" as="p" hint-placeholder-count="3">
<a href="{{p.url}}" target="_blank" rel="noopener" onClick="{{p.click}}" style="display: flex; gap: 14px; align-items: center; background: #FFFFFF; color: #14174F; border-radius: 16px; padding: 14px 16px; text-decoration: none; min-height: 76px">
<span aria-hidden="true" style="flex: none; width: 48px; height: 48px; border-radius: 14px; background: {{p.color}}; color: #FFFFFF; display: grid; place-items: center; font-family: Geist, sans-serif; font-weight: 800; font-size: 22px">{{p.initial}}</span>
<span style="flex: 1; min-width: 0"><strong style="display: block; font-family: Geist, sans-serif; font-weight: 800; font-size: 18px">{{p.name}}</strong><span style="display: block; font-size: 14px">{{p.offer}}</span></span>
<span aria-hidden="true" style="flex: none; font-size: 22px; font-weight: 800; color: #1E4ADD">→</span>
</a>
</template>
</div>
</div>
</section>
<div style="max-width: 1240px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 40px) 0">
<nav aria-label="Deal categories" style="position: sticky; top: 64px; z-index: 5; background: #F5F6FB; padding: 8px 0 12px; display: flex; gap: 8px; overflow-x: auto">
<template data-sc="for" list="{{deals.cats}}" as="c" hint-placeholder-count="5"><button onClick="{{c.go}}" aria-pressed="{{c.on}}" style="flex: none; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid #1E4ADD; background: {{c.bg}}; color: {{c.fg}}; font-size: 15px; font-weight: 700; white-space: nowrap">{{c.label}} <span style="font-weight: 500">({{c.n}})</span></button></template>
</nav>
<template data-sc="for" list="{{deals.groups}}" as="g" hint-placeholder-count="4">
<section style="margin: 14px 0 28px">
<h2 style="margin: 0 0 4px; font-family: Geist, sans-serif; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; font-size: 26px">{{g.t}}</h2>
<p style="margin: 0 0 14px; font-size: 15px; color: #4A4F86">{{g.d}}</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 14px">
<template data-sc="for" list="{{g.items}}" as="p" hint-placeholder-count="3">
<article style="background: #FFFFFF; border: 1px solid #E3E7F5; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
<div style="background: {{p.color}}; color: #FFFFFF; padding: 16px 18px; display: flex; gap: 12px; align-items: center">
<span aria-hidden="true" style="flex: none; width: 46px; height: 46px; border-radius: 12px; background: rgba(255,255,255,.18); display: grid; place-items: center; font-family: Geist, sans-serif; font-weight: 800; font-size: 22px">{{p.initial}}</span>
<div style="flex: 1; min-width: 0"><h3 style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; font-size: 20px; line-height: 1.15">{{p.name}}</h3><p style="margin: 2px 0 0; font-size: 13px">{{p.tag}}</p></div>
<template data-sc="if" value="{{p.hasWhen}}" hint-placeholder-val="{{true}}"><span style="flex: none; font-size: 12px; font-weight: 800; background: #F8D93A; color: #0B1440; border-radius: 999px; padding: 4px 10px">{{p.when}}</span></template>
</div>
<div style="padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1">
<template data-sc="if" value="{{p.hasOffer}}" hint-placeholder-val="{{true}}"><p style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; font-size: 19px; line-height: 1.2">{{p.offer}}</p></template>
<p style="margin: 0; font-size: 15px"><strong style="font-weight: 700">Good for:</strong> {{p.good}}</p>
<p style="margin: 0; font-size: 15px"><strong style="font-weight: 700">Tip:</strong> {{p.tip}}</p>
<template data-sc="if" value="{{p.hasWarn}}" hint-placeholder-val="{{false}}"><p style="margin: 0; font-size: 15px; background: #FDE2E6; color: #7A0E1F; border-radius: 10px; padding: 10px 12px"><strong style="font-weight: 800">Visa warning:</strong> {{p.warn}}</p></template>
<template data-sc="if" value="{{p.hasCode}}" hint-placeholder-val="{{false}}"><div style="display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: #FFF3CC; border: 2px dashed #E0A100; border-radius: 12px; padding: 10px 12px"><span style="font-size: 14px">Code</span><strong style="font-family: Geist, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: .08em">{{p.code}}</strong><button onClick="{{p.copy}}" style="margin-left: auto; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 2px solid #14174F; background: #FFFFFF; color: #14174F; font-size: 14px; font-weight: 700">{{p.copyLabel}}</button></div></template>
<a class="btn ind" href="{{p.url}}" target="_blank" rel="noopener" onClick="{{p.click}}" style="margin-top: auto; align-self: stretch; text-align: center; min-height: 48px">{{p.cta}}</a>
</div>
</article>
</template>
</div>
</section>
</template>
<section aria-labelledby="disc-h" style="background: #FFFFFF; border: 1px solid #E3E7F5; border-radius: 16px; padding: 18px 20px; max-width: 52em">
<h2 id="disc-h" style="margin: 0 0 6px; font-family: Geist, sans-serif; font-weight: 800; font-size: 18px">About these links</h2>
<p style="margin: 0; font-size: 14px">Cards marked “Referral link” are referral links: UniWork may get a reward when you sign up, at no cost to you, and some give you a reward too. Each company sets its own rewards and terms, and can change them, so check them before you sign up. Partners never change our visa checks or advice.</p>
</section>
</div>
</main>
</template>

<!-- ============ ACCOUNT ============ -->
<template data-sc="if" value="{{isAccount}}" hint-placeholder-val="{{false}}">
<main style="background: #F5F6FB; padding-bottom: 80px">
<section style="background: #1E4ADD; color: #FFFFFF; padding: clamp(28px, 4vw, 52px) clamp(16px, 4vw, 40px)">
<div style="max-width: 1240px; margin: 0 auto">
<h1 style="margin: 0; font-family: Geist, sans-serif; font-weight: 800; font-size: clamp(36px, 5vw, 64px); line-height: 1; letter-spacing: -0.035em">{{accTitle}}</h1>
<p style="margin: 14px 0 0; max-width: 44em; font-size: 18px">Free. Save your course end date and we email you before the deadlines that decide whether you can stay: your Graduate visa window, your sponsor search and your offer deadline.</p>
</div>
</section>
<div style="max-width: 1240px; margin: 0 auto; padding: 28px clamp(16px, 4vw, 40px) 0; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section aria-labelledby="acc-h" style="flex: 1 1 420px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E7F5; border-radius: 16px; padding: clamp(20px, 2.6vw, 30px)">
<h2 id="acc-h" style="margin: 0 0 14px; font-family: Geist, sans-serif; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; font-size: 24px">Your details</h2>
<form onSubmit="{{accSubmit}}" style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; gap: 12px"><div style="flex: 1 1 200px"><label for="ac-name" style="display: block; font-weight: 600; margin-bottom: 6px">Name</label><input id="ac-name" class="field" autocomplete="name" value="{{acc.name}}" onChange="{{accSet.name}}" onInput="{{accSet.name}}"></div><div style="flex: 1 1 200px"><label for="ac-email" style="display: block; font-weight: 600; margin-bottom: 6px">Email</label><input id="ac-email" class="field" type="email" autocomplete="email" value="{{acc.email}}" onChange="{{accSet.email}}" onInput="{{accSet.email}}"></div></div>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><div style="flex: 1 1 160px"><label for="ac-country" style="display: block; font-weight: 600; margin-bottom: 6px">Home country</label><select id="ac-country" class="field" autocomplete="country-name" value="{{country}}" onChange="{{setCountry}}"><option value="">Choose your country</option><template data-sc="for" list="{{countryOpts}}" as="c" hint-placeholder-count="5"><option value="{{c}}">{{c}}</option></template></select></div><div style="flex: 1 1 160px"><label for="ac-city" style="display: block; font-weight: 600; margin-bottom: 6px">City</label><select id="ac-city" class="field" value="{{acc.city}}" onChange="{{accSet.city}}"><template data-sc="for" list="{{accCities}}" as="c" hint-placeholder-count="3"><option value="{{c}}">{{c}}</option></template></select></div></div>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><div style="flex: 1 1 200px"><label for="ac-uni" style="display: block; font-weight: 600; margin-bottom: 6px">University</label><input id="ac-uni" class="field" value="{{acc.university}}" onChange="{{accSet.university}}" onInput="{{accSet.university}}"></div><div style="flex: 1 1 200px"><label for="ac-end" style="display: block; font-weight: 600; margin-bottom: 6px">Course ends</label><input id="ac-end" class="field" type="month" value="{{gradEnd}}" onChange="{{setGradEnd}}" onInput="{{setGradEnd}}"></div></div>
<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 15px"><input type="checkbox" checked="{{acc.consent}}" onChange="{{accToggleConsent}}" style="flex: none; width: 22px; height: 22px; margin-top: 2px; accent-color: #1E4ADD"><span>Email me reminders about my visa deadlines and when full access opens. I can stop them any time.</span></label>
<p role="status" aria-live="polite" style="margin: 0; font-weight: 600; color: {{accMsgColor}}">{{accMsg}}</p>
<button type="submit" class="btn ind" style="align-self: flex-start">{{accButton}}</button>
<p style="margin: 0; font-size: 13px">We store your name, email, home country, university, city and course end date to send these reminders. We never sell your data. You can ask us to delete it at any time.</p>
</form>
</section>
<section aria-labelledby="rem-h" style="flex: 1 1 380px; min-width: 0; background: #14174F; color: #FFFFFF; border-radius: 16px; padding: clamp(20px, 2.6vw, 30px)">
<h2 id="rem-h" style="margin: 0 0 6px; font-family: Geist, sans-serif; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; font-size: 24px; color: #F8D93A">Your reminders</h2>
<p style="margin: 0 0 14px; font-size: 15px">{{grad.length}}</p>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px"><template data-sc="for" list="{{grad.steps}}" as="g" hint-placeholder-count="4"><li style="display: flex; gap: 12px; background: rgba(255,255,255,.07); border-radius: 10px; padding: 10px 12px"><span style="flex: none; min-width: 80px; font-weight: 800; color: #F8D93A">{{g.when}}</span><span><strong style="display: block; font-weight: 700">{{g.t}}</strong><span style="font-size: 14px">{{g.d}}</span></span></li></template></ol>
</section>
<template data-sc="if" value="{{showStats}}" hint-placeholder-val="{{false}}">
<section aria-labelledby="st-h" style="flex: 1 1 100%; background: #FFFFFF; border: 1px solid #E3E7F5; border-radius: 16px; padding: clamp(20px, 2.6vw, 30px)">
<h2 id="st-h" style="margin: 0 0 6px; font-family: Geist, sans-serif; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; font-size: 24px">Owner view: fake-door test</h2>
<p style="margin: 0 0 14px; font-size: 15px">The numbers that show whether UniWork works: activation, return visits, leads and the fake-door test. Only you see this panel.</p>
<form onSubmit="{{loadStats}}" style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end"><div style="flex: 1 1 260px"><label for="st-key" style="display: block; font-weight: 600; margin-bottom: 6px">Admin key (live site only)</label><input id="st-key" class="field" type="password" autocomplete="off" value="{{adminKey}}" onChange="{{setAdminKey}}" onInput="{{setAdminKey}}"></div><button type="submit" class="btn ind">Load the numbers</button></form>
<p role="status" aria-live="polite" style="margin: 12px 0 0; font-weight: 600">{{stats.line}}</p>
<template data-sc="for" list="{{stats.lists}}" as="l" hint-placeholder-count="2"><p style="margin: 10px 0 0; font-size: 14px"><strong style="font-weight: 800">{{l.t}}:</strong> {{l.v}}</p></template>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 12px"><template data-sc="for" list="{{stats.tiles}}" as="t" hint-placeholder-count="6"><div style="background: #F5F6FB; border-radius: 12px; padding: 12px 14px"><p style="margin: 0; font-size: 13px; font-weight: 600">{{t.t}}</p><p style="margin: 2px 0 0; font-family: Geist, sans-serif; font-weight: 800; font-size: 28px">{{t.v}}</p><p style="margin: 0; font-size: 13px; color: #4A4F86">{{t.d}}</p></div></template></div>
</section>
</template>
</div>
</main>
</template>

<!-- ============ JOB DETAIL ============ -->

<dt style="color: #4A4F86">Contract</dt><dd style="margin: 0">{{jobDetail.contract}}</dd>

<ul style="margin: 0; padding-left: 20px; font-size: 15px"><template data-sc="for" list="{{jobDetail.adFindings}}" as="f" hint-placeholder-count="2"><li style="margin-top: 4px"><strong style="font-weight: 700; color: {{f.color}}">{{f.tag}}</strong> {{f.msg}}</li></template></ul>

</label>
